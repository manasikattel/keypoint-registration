seed: 42
run_name: keypoint_registration
checkpoint: null

trainer:
  max_epochs: 500
  accelerator: auto
  devices: 1

logger:
  _target_: lightning.pytorch.loggers.CSVLogger
  save_dir: null
  name: logs

data:
  _target_: crosskey.data.PairedVolumeDataModule
  cfg:
    # Set this at runtime: python train.py data.cfg.data_dir=/path/to/data
    data_dir: ???
    files:
      source_mask: source_mask.nii.gz
      target_mask: target_mask.nii.gz
      source_image: source_image.nii.gz
      target_image: target_image.nii.gz
      transform: transform.txt
      source_landmarks: null
      target_landmarks: null
    train_range: [0, 1000]
    val_range: [1000, 1100]
    test_range: [1100, 1200]
    output_size: [96, 96, 96]
    train: true
    train_batch_size: 1
    val_batch_size: 1
    test_batch_size: 1
    train_num_workers: 2
    val_num_workers: 2
    test_num_workers: 2
    transforms: true
    rotation_range: 30
    translation_range: 2
    augment_prob: 0.8
    sampling_space: rvs
    intensity_augmentation:
      # The source branch corresponds to the MRI input in the paper experiments.
      # It uses the original MRI-specific augmentation pipeline from the full repo.
      source:
        apply_mri_augmentations: true
      target:
        apply_mri_augmentations: false

model:
  _target_: crosskey.models.KeyRegModule
  learning_rate: 0.00001
  loss: bbvre
  num_keypoints: 8
  backbone: swinunetr_interp  # options: unet, equiv_unet, swinunetr_interp
  input_channels: 2           # 1=image only, 2=mask+image
  input_shape: [96, 96, 96]

  # U-Net / equivariant U-Net options
  base_feat: 32
  n_conv: 2
  levels: 4
  kernel_size: 3
  feat_mult: 2
  last_activation: softmax
  equiv_steps: [1.0, 1.0, 1.0]
  equiv_lmax: 2
  equiv_scale: 2
  equiv_normalization: instance

  # SwinUNETR interpolation-decoder options
  swin_feature_size: 24
  swin_depths: [2, 2, 2, 2]
  swin_num_heads: [3, 6, 12, 24]
  swin_norm_name: instance
  swin_drop_rate: 0.0
  swin_attn_drop_rate: 0.0
  swin_dropout_path_rate: 0.0
  swin_use_checkpoint: true
  swin_upsample_mode: trilinear
  swin_align_corners: false
  swin_use_v2: false

  chkp_pretrained: null
  temperature_repulsive_loss: 5
  weight_registration_loss: 1
  weight_kl_loss: 1
  weight_repulsive_loss: 2.5
  weight_var_loss: 0.0001
  weight_kp_dist: 0.5
  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    _partial_: true
    mode: min
    factor: 0.5
    patience: 20

hydra:
  run:
    dir: outputs/${run_name}/${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: false

prediction:
  checkpoint: null
  split: test
  output_dir: outputs/prediction_scores
  voxel_spacing_mm: 1.0
